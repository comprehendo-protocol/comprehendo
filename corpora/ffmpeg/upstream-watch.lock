          "-hide_banner",
          "-nostdin",
          "-f",
          "lavfi",
          "-i",
          "testsrc=size=1442x1440:rate=5:duration=1",
          "-vf",
          "scale=-2:720",
          "-c:v",
          "libx264",
          "-pix_fmt",
          "yuv420p",
          "-y",
          "out.mp4"
        ],
        "capture": {
          "read": "dimensions",
          "file": "out.mp4"
        }
      },
      "expect": {
        "status": 0,
        "capture": "722,720"
      },
      "lockedVersion": "ffmpeg version 4.4.2-0ubuntu0.22.04.1 Copyright (c) 2000-2021 the FFmpeg developers",
      "observedAt": "2026-08-22"
